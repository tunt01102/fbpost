[project]
name = "fbauto"
version = "0.1.0"
description = "FB Auto Poster — tự sinh & hẹn giờ đăng Facebook bằng AI (CLI subscription, không API key)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "tenacity>=8.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Đăng qua trình duyệt (Playwright) — tùy chọn, chỉ khi không dùng Graph API
browser = ["playwright>=1.44"]
# Fallback provider dùng API trả phí (không bắt buộc; CLI subscription là mặc định)
api = ["anthropic>=0.40", "openai>=1.40", "google-generativeai>=0.7"]

[project.scripts]
fbauto = "fbauto.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbauto"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
